name: CI

# Checks every push and pull request. Deploys are deliberately NOT done from
# here: production runs on the VPS from /home/baud/art.ollo and is released
# on-host (staging container over a copy of the live DB, then
# `docker compose up --build -d`), so no SSH key into production lives in
# GitHub. See CLAUDE.md "Deployment".

on:
  push:
    branches: [main, pro-upgrade]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same major as the production image (oven/bun:1).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (app + server)
        run: bun run check:types

      - name: Lint
        run: bun run check:lint

      # tests/setup.ts overwrites every secret; CI has no .env at all.
      - name: Test
        run: bun test

      - name: Build
        run: bun run build
